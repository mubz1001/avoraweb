<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="same-origin" />
    <title>Avora Bookings – The best booking platform in Somalia</title>
    <meta
      name="description"
      content="Avora Bookings is the best booking platform in Somalia. Book your stay with confidence: hotels in Mogadishu, Hargeisa, Garowe and more, free cancellation on most stays, and pay with EVC Plus, ZAAD, SAHAL, eDahab or card."
    />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="Avora Bookings" />
    <meta name="apple-mobile-web-app-title" content="Avora" />

    <!-- Social sharing -->
    <meta property="og:site_name" content="Avora Bookings" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Avora Bookings – The best booking platform in Somalia" />
    <meta property="og:description" content="Book your stay with confidence. Hotels across Somalia, free cancellation on most stays, local payment methods." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avora Bookings: the best booking platform in Somalia. Book your stay with confidence." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Avora Bookings – The best booking platform in Somalia" />
    <meta name="twitter:description" content="Book your stay with confidence. Hotels across Somalia, free cancellation on most stays, local payment methods." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="Avora Bookings: the best booking platform in Somalia. Book your stay with confidence." />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://www.google.com" />

    <!-- Structured data: lets search engines show the brand name, logo and a site name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "Avora Bookings",
            "alternateName": "AVORA",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/icon-512.png",
            "slogan": "Book your stay with confidence",
            "description": "The best booking platform in Somalia.",
            "areaServed": { "@type": "Country", "name": "Somalia" },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer service",
              "telephone": "+252610999082",
              "availableLanguage": ["English", "Somali", "Arabic"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "Avora Bookings",
            "inLanguage": "en",
            "publisher": { "@id": "__SITE_URL__/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Avora Bookings, the best booking platform in Somalia, needs JavaScript to search and book stays.</noscript>
    <script type="module" src="/src/main.tsx"></script>
